version: '3.8'

services:
  backend:
    build: ./BackEnd
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      db:
        condition:
          service_healthy
    command: sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    container_name: test_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: test_db
    ports:
      - "5434:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d test_db"]
      interval: 5s
      timeout: 1s
      retries: 5

networks:
  app-network:
    driver: bridge

